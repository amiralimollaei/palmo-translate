[package]
name = "palmo-translate"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "A native GTK translation client for PLaMo"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
anyhow = "1"
async-channel = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[profile.release]
lto = "thin"
strip = true
